# Deploy dalytrips.com frontend to the VPS on every push to main.
#
# Required GitHub repository secrets:
#   VPS_HOST              — public IP or hostname (e.g. dalytrips.com or VPS IP)
#   VPS_USER              — SSH user (e.g. don)
#   VPS_SSH_PRIVATE_KEY   — private key for that user (ed25519 recommended)
#   VPS_DEPLOY_PATH       — absolute path to this repo on the server (e.g. /home/don/daly-trip)
#
# One-time VPS setup: see DEPLOY.md

name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm test
      - run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            bash scripts/vps-deploy.sh
