<!DOCTYPE html>
<html>
<body style="margin:0;padding:0;background:#F5F2EA;font-family:Arial,Helvetica,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#F5F2EA;padding:32px 16px;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFFFF;border:2px solid #C9A24B;border-radius:20px;overflow:hidden;box-shadow:0 8px 32px rgba(13,31,60,0.14);">
          <tr>
            <td style="background:#0D1F3C;padding:28px 32px;text-align:center;">
              <div style="font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#C9A24B;font-weight:700;margin-bottom:8px;">
                Daly Trips
              </div>
              <div style="font-size:24px;font-weight:900;color:#FFFFFF;line-height:1.2;">
                Your sign-in code
              </div>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;text-align:center;">
              <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:rgba(13,31,60,0.55);">
                Enter this code in the app to continue. It expires shortly and can only be used once.
              </p>
              <div style="display:inline-block;background:#F5F2EA;border:2px solid #C9A24B;border-radius:16px;padding:20px 36px;margin:8px 0 24px;">
                <span style="font-size:36px;font-weight:900;letter-spacing:0.35em;color:#0D1F3C;font-family:'Courier New',monospace;">
                  {{ .Token }}
                </span>
              </div>
              <p style="margin:0;font-size:13px;color:rgba(13,31,60,0.55);">
                Sent to <strong style="color:#060E1E;">{{ .Email }}</strong>
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px 28px;border-top:1px solid rgba(13,31,60,0.18);text-align:center;">
              <p style="margin:0;font-size:12px;color:rgba(13,31,60,0.55);">
                Didn't request this? You can ignore this email.
              </p>
              <p style="margin:8px 0 0;font-size:12px;color:rgba(13,31,60,0.55);">
                <a href="https://dalytrips.com" style="color:#B8903A;text-decoration:none;">dalytrips.com</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
